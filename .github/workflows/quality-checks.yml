name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  website:
    name: Website (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (ruff, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m ruff format --check tests
      - run: DATABASE_URL=sqlite:///./test_poschair.db python -m pytest -q

  firmware:
    name: Firmware (ESP32 compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install firmware libraries
        run: arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Compile controller firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/poschair_firmware
      - name: Compile bench-test firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/test
